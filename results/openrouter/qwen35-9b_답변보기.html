    items.forEach(x => ol.append(answerItem(x.i + 1, x.a, counts[x.a.text])));
    if (!items.length) ol.innerHTML = '<li><span class="n"></span><div class="t" style="color:var(--muted)">표시할 답이 없습니다 (모두 깨짐)</div></li>';
    sec.append(ol); list.append(sec);
  }
}
$("group").onchange = e => { state.group = e.target.checked; save(); render(); };
$("hidebroken").onchange = e => { state.hide = e.target.checked; save(); render(); };
if (!DATA[state.c]) state.c = "C";
render();
</script>
