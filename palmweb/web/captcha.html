<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>손 확인</title>
</head>
<body>
  <main id="captcha">
    <section class="card" id="card" data-phase="pick">
      <header class="head">
        <p class="eyebrow">사람인지 확인합니다<span id="who" class="who"></span></p>
        <h1>매력을 느끼는 <em>'손'</em>을<br>선택하세요</h1>
        <p class="sub" id="sub">마음이 가는 칸을 모두 누른 뒤 확인을 누르세요. 몇 개든 좋습니다</p>
      </header>
      <div class="grid" id="grid" role="group" aria-label="아홉 장의 이미지"></div>
      <figure class="merge" id="merge" hidden><div class="merge-frame"><img id="merge-img" alt="선택한 손을 하나로 합친 그림" draggable="false"><figcaption id="merge-cap"></figcaption></div></figure>
      <footer class="foot">
        <div class="foot-left">
          <button id="refresh" class="icon" type="button" title="다시 섞기" aria-label="다시 섞기">↻</button>
          <span class="brand"><span class="brand-mark">✋</span><span>handCAPTCHA</span></span>
        </div>
        <p class="verdict" id="verdict" hidden></p>
        <button id="verify" class="verify" type="button" disabled>확인</button>
        <button id="next" class="verify" type="button" hidden>다음 사람</button>
      </footer>
    </section>
  </main>
  <script type="module" src="/src/captcha.ts"></script>
</body>
</html>
